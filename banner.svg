<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="280">
  <defs>
    <!-- Dark Tactical Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#05080e"/>
    </linearGradient>

    <!-- Subtle Dot Pattern -->
    <pattern id="cyber-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" rx="10" fill="url(#bg-grad)"/>
  <rect width="100%" height="100%" rx="10" fill="url(#cyber-grid)"/>
  <rect width="100%" height="100%" rx="10" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Tactical Corner Viewfinder Crosshairs -->
  <path d="M 15 35 L 15 15 L 35 15" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.8"/>
  <path d="M 905 35 L 905 15 L 885 15" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.8"/>
  <path d="M 15 245 L 15 265 L 35 265" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.8"/>
  <path d="M 905 245 L 905 265 L 885 265" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.8"/>

  <!-- Top Metadata Bar -->
  <g font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" font-weight="600" letter-spacing="1.5">
    <text x="45" y="32" fill="#00f0ff" opacity="0.9">[+] SEC_OPS // OFFENSIVE_RECON</text>
    <text x="875" y="32" text-anchor="end" fill="#64748b">BUILD: <tspan fill="#10b981">v1.0.0_STABLE</tspan> // ARCH: HEADLESS_DOM</text>
    <line x1="45" y1="44" x2="875" y2="44" stroke="#1e293b" stroke-width="1"/>
  </g>

  <!-- Center Decorative Scanner Reticle / Wave -->
  <g opacity="0.35" stroke="#00f0ff" stroke-width="1">
    <!-- Target Circle -->
    <circle cx="460" cy="125" r="52" fill="none" stroke-dasharray="4, 6" opacity="0.5"/>
    <circle cx="460" cy="125" r="2" fill="#00f0ff"/>
    <line x1="385" y1="125" x2="400" y2="125"/>
    <line x1="520" y1="125" x2="535" y2="125"/>
    <line x1="460" y1="60" x2="460" y2="75"/>
    <line x1="460" y1="175" x2="460" y2="190"/>
  </g>

  <!-- Main Cyber Typography -->
  <!-- Back shadow for depth -->
  <text x="460" y="146" text-anchor="middle" font-family="'JetBrains Mono', 'Segoe UI', Consolas, monospace" font-size="58" font-weight="900" letter-spacing="10" fill="#030712" stroke="#0f172a" stroke-width="4">
    SEC-XRAY
  </text>
  <!-- Foreground text -->
  <text x="460" y="146" text-anchor="middle" font-family="'JetBrains Mono', 'Segoe UI', Consolas, monospace" font-size="58" font-weight="900" letter-spacing="10" fill="#f8fafc">
    SEC<tspan fill="#00f0ff">-</tspan><tspan fill="#38bdf8">X</tspan>RAY
  </text>

  <!-- Tactical Subtitle -->
  <text x="460" y="182" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="3.5">
    PASSIVE &amp; DYNAMIC SPA/JS RECONNAISSANCE ENGINE
  </text>

  <!-- Bottom Divider Line -->
  <line x1="45" y1="208" x2="875" y2="208" stroke="#1e293b" stroke-width="1"/>

  <!-- Bottom HUD Module Telemetry -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10.5" font-weight="600" letter-spacing="1.2">
    <g transform="translate(55, 235)">
      <rect x="0" y="0" width="170" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="10" y="15" fill="#64748b">[01] ENGINE : <tspan fill="#38bdf8">CHROMIUM</tspan></text>
    </g>

    <g transform="translate(245, 235)">
      <rect x="0" y="0" width="185" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="10" y="15" fill="#64748b">[02] EVASION : <tspan fill="#10b981">STEALTH_V2</tspan></text>
    </g>

    <g transform="translate(450, 235)">
      <rect x="0" y="0" width="200" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="10" y="15" fill="#64748b">[03] CRAWL : <tspan fill="#e2e8f0">EVENT_DOM</tspan></text>
    </g>

    <g transform="translate(670, 235)">
      <rect x="0" y="0" width="195" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="10" y="15" fill="#64748b">[04] EXPORT : <tspan fill="#f59e0b">CSV + POSTMAN</tspan></text>
    </g>
  </g>
</svg>