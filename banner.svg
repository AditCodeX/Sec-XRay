<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#080c16"/>
      <stop offset="100%" stop-color="#0d0818"/>
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Text Neon Gradients -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="65%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#ff2a85"/>
    </linearGradient>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="100%" height="100%" rx="18" fill="url(#card-bg)" stroke="url(#border-grad)" stroke-width="1.8"/>

  <!-- Subtle Cyber Grid pattern lines -->
  <g opacity="0.07" stroke="#00f0ff" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="240"/>
    <line x1="150" y1="0" x2="150" y2="240"/>
    <line x1="750" y1="0" x2="750" y2="240"/>
    <line x1="850" y1="0" x2="850" y2="240"/>
    <line x1="0" y1="60" x2="900" y2="60"/>
    <line x1="0" y1="180" x2="900" y2="180"/>
  </g>

  <!-- Terminal Window Controls -->
  <circle cx="35" cy="30" r="6" fill="#ff5f56" opacity="0.85"/>
  <circle cx="55" cy="30" r="6" fill="#ffbd2e" opacity="0.85"/>
  <circle cx="75" cy="30" r="6" fill="#27c93f" opacity="0.85"/>
  <text x="105" y="34" fill="#475569" font-family="ui-monospace, monospace" font-size="12" font-weight="bold">sec-xray // enterprise reconnaissance</text>

  <!-- Main Brand Title -->
  <g text-anchor="middle" filter="url(#neon-glow)">
    <text x="450" y="128" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="900" letter-spacing="6" fill="url(#text-grad)">
      SEC<tspan fill="#a855f7">-</tspan>XRAY
    </text>
  </g>

  <!-- Tagline Badge Pill -->
  <g text-anchor="middle">
    <!-- Feature Pills -->
    <rect x="230" y="150" width="120" height="24" rx="12" fill="#00f0ff" fill-opacity="0.12" stroke="#00f0ff" stroke-opacity="0.4" stroke-width="1"/>
    <text x="290" y="166" font-family="ui-monospace, monospace" font-size="11" font-weight="bold" fill="#38bdf8">⚡ DEEP CRAWL</text>

    <rect x="365" y="150" width="110" height="24" rx="12" fill="#a855f7" fill-opacity="0.12" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1"/>
    <text x="420" y="166" font-family="ui-monospace, monospace" font-size="11" font-weight="bold" fill="#c084fc">🛡️ WAF STEALTH</text>

    <rect x="490" y="150" width="175" height="24" rx="12" fill="#ff007f" fill-opacity="0.12" stroke="#ff007f" stroke-opacity="0.4" stroke-width="1"/>
    <text x="577" y="166" font-family="ui-monospace, monospace" font-size="11" font-weight="bold" fill="#fb7185">📦 POSTMAN COMPILER</text>
  </g>

  <!-- Bottom Subtitle Bar -->
  <text x="450" y="210" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="1.2">
    PASSIVE &amp; DYNAMIC SPA/JS RECONNAISSANCE ENGINE • <tspan fill="#00f0ff" font-weight="bold">v1.0.0</tspan>
  </text>
</svg>